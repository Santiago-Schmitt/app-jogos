<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>😘Catálogo de Jogos</h1>

    <section class="filtros">
        <h2>Filtros Jogos</h2>
        <input type="text"text id="filtro-genero" placeholder="Gênero">
        <input type="text"text id="filtro-plataforma" placeholder="Plataforma">
        <input type="text"text id="filtro-notaMin" placeholder="Nota Mínima" step="0.1">
        <button id="tn-filtrar">Buscar</button>
        <button id="tn-limpar">Limpar</button>
    </section>

    <section class="formulario">
        <h2 id="titulo-form">Cadastrar Jogo</h2>
        <form id="form-jogo">
            <input type="hidden" id="jogo-id">
            <input type="text" id="titulo" placeholder="Titulo" required>
            <input type="text" id="genero" placeholder="Gênero" required>
            <input type="text" id="plataforma" placeholder="Plataforma" required>
            <input type="number" id="ano" placeholder="Ano" required>
            <input type="number" id="nota" placeholder="Nota (opicional)" step="0.1">
            <button type="submit">Salvar</button>
            <button type="button" id="btn-cancelar">Cancelar</button>
        </form>
    </section>

    <section class="lista">
        <h2>Jogos Cadastrados</h2>
        <table>
            <thead>
                <th>Título</th><th>Gênero</th><th>Plataforma</th>
                <th>Ano</th><th>Nota</th><th>Ações</th>
            </thead>
            <tbody id="lista-jogos"></tbody>
        </table>
    </section>

    <script src="script.js"></script>

</body>
</html>
